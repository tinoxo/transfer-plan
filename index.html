function ChecklistView() {
  const [checked, setChecked] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem("vl_checklist") || "{}"); } catch { return {}; }
  });
  const [open, setOpen] = React.useState({});
  const saveChecked = (fn) => {
    setChecked(prev => {
      const next = fn(prev);
      try { localStorage.setItem("vl_checklist", JSON.stringify(next)); } catch {}
      return next;
    });
  };
  const total = CHECKLIST_PHASES.flatMap(p => p.items).length;
  const done = Object.values(checked).filter(Boolean).length;
  const pct = Math.round((done / total) * 100);

  return (
    <div>
      <div style={{ background: "white", border: "1px solid #E8E3DC", borderRadius: 10, padding: "12px 16px", marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: "#aaa", fontFamily: "monospace", marginBottom: 8 }}>
          <span>{done} of {total} completed</span><span>{pct}%</span>
        </div>
        <div style={{ height: 6, background: "#E8E3DC", borderRadius: 6, overflow: "hidden" }}>
          <div style={{ height: "100%", width: pct + "%", background: "linear-gradient(90deg,#27AE60,#2ECC71)", borderRadius: 6, transition: "width 0.4s" }} />
        </div>
      </div>
      {CHECKLIST_PHASES.map(phase => {
        const phaseDone = phase.items.filter(i => checked[i.id]).length;
        return (
          <div key={phase.id} style={{ marginBottom: 10, borderRadius: 10, overflow: "hidden", border: "1px solid #E8E3DC" }}>
            <div style={{ background: phase.color, padding: "10px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <span style={{ fontSize: 12, fontWeight: 700, color: "white", fontFamily: "monospace", letterSpacing: "0.06em", textTransform: "uppercase" }}>{phase.label}</span>
                <span style={{ fontSize: 11, color: "rgba(255,255,255,0.6)", marginLeft: 10 }}>{phase.sub}</span>
              </div>
              <span style={{ fontSize: 11, color: "rgba(255,255,255,0.8)", fontFamily: "monospace" }}>{phaseDone}/{phase.items.length}</span>
            </div>
            <div style={{ background: "white" }}>
              {phase.items.map((item, i) => (
                <div key={item.id} style={{ borderBottom: i < phase.items.length - 1 ? "1px solid #F0ECE8" : "none", opacity: checked[item.id] ? 0.5 : 1, transition: "opacity 0.2s" }}>
                  <div style={{ display: "flex", alignItems: "flex-start", gap: 12, padding: "10px 16px", cursor: "pointer" }} onClick={() => setOpen(o => ({ ...o, [item.id]: !o[item.id] }))}>
                    <div
                      onClick={e => { e.stopPropagation(); saveChecked(c => ({ ...c, [item.id]: !c[item.id] })); }}
                      style={{ width: 20, height: 20, borderRadius: 5, border: checked[item.id] ? "none" : "2px solid #ccc", background: checked[item.id] ? "#27AE60" : "white", flexShrink: 0, marginTop: 1, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", transition: "all 0.15s" }}
                    >
                      {checked[item.id] && <svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4L4 7.5L10 1" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                        <span style={{ fontSize: 13, fontWeight: 600, color: checked[item.id] ? "#aaa" : "#1a1a1a", textDecoration: checked[item.id] ? "line-through" : "none" }}>{item.task}</span>
                        {item.urgent && !checked[item.id] && <span style={{ fontSize: 10, fontWeight: 700, color: "#C0392B", background: "#FDF2F2", border: "1px solid #F1948A", padding: "1px 7px", borderRadius: 20, letterSpacing: "0.04em" }}>URGENT</span>}
                      </div>
                    </div>
                    <span style={{ fontSize: 11, color: "#ccc", transform: open[item.id] ? "rotate(180deg)" : "rotate(0deg)", transition: "transform 0.2s", flexShrink: 0 }}>▾</span>
                  </div>
                  {open[item.id] && (
                    <div style={{ padding: "0 16px 12px 48px", fontSize: 12, color: "#666", lineHeight: 1.6 }}>{item.detail}</div>
                  )}
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

            </div>
            {school.logo && (
              <div style={{ flex: 1, background: "white", borderRadius: 10, border: "1px solid #E8E3DC", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, minHeight: 120 }}>
                <img
                  src={school.logo}
                  alt={school.name + " seal"}
                  style={{ width: 110, height: 110, objectFit: "contain" }}
                  onError={e => e.target.style.display = "none"}
                />
              </div>
            )}
          </div>
        </div>

        {/* Admission note */}
        <div style={{ background: "#FFFBF4", border: "1px solid #F0D080", borderRadius: 10, padding: "10px 14px", marginBottom: 16, fontSize: 12, color: "#7A4800", lineHeight: 1.5 }}>
          <strong>Admissions note:</strong> {school.admissionNote}
        </div>

        {/* Gaps if any */}
        {school.gaps.length > 0 && (
          <div style={{ background: "#FDF2F2", border: "1px solid #F1948A", borderRadius: 10, padding: "10px 14px", marginBottom: 16 }}>
            <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: "#922B21", fontFamily: "monospace", marginBottom: 6 }}>Gaps / Flags</div>
            {school.gaps.map((g, i) => (
              <div key={i} style={{ fontSize: 12, color: "#922B21", lineHeight: 1.5, marginBottom: 2 }}>⚠ {g}</div>
            ))}
          </div>
        )}

        {/* Requirements */}
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: "#aaa", fontFamily: "monospace", marginBottom: 8 }}>
            Major Prerequisites
          </div>
          <div style={{ background: "white", borderRadius: 10, border: "1px solid #E8E3DC", overflow: "hidden" }}>
            {school.requirements.map((req, i) => {
              const cfg = STATUS_CONFIG[req.status];
              return (
                <div
                  key={i}
                  style={{
                    display: "grid",
                    gridTemplateColumns: "1fr 1fr auto",
                    gap: 12,
                    padding: "10px 16px",
                    borderBottom: i < school.requirements.length - 1 ? "1px solid #F0ECE8" : "none",
                    background: req.status === "gap" ? "#FDF2F2" : "white",
                    alignItems: "start",
                  }}
                >
                  <div>
                    <div style={{ fontSize: 12, fontWeight: 600, color: "#1a1a1a" }}>{req.name}</div>
                    {req.note && <div style={{ fontSize: 11, color: "#999", marginTop: 2, lineHeight: 1.4 }}>{req.note}</div>}
                  </div>
                  <div>
                    <div style={{ fontSize: 12, color: "#555" }}>{req.course}</div>
                    <div style={{ fontSize: 10, color: "#aaa", marginTop: 1, fontFamily: "monospace" }}>{req.sem}</div>
                  </div>
                  <div style={{
                    display: "flex", alignItems: "center", gap: 4,
                    padding: "2px 8px", borderRadius: 12,
                    background: cfg.bg, color: cfg.color,
                    fontSize: 11, fontWeight: 700, whiteSpace: "nowrap",
                  }}>
                    <span>{cfg.icon}</span>
                    <span>{cfg.label}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* IGETC if available */}
        {school.igetc && (
          <div style={{ marginBottom: 16 }}>
            <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: "#aaa", fontFamily: "monospace", marginBottom: 8 }}>IGETC Completion</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 6 }}>
              {school.igetc.map((item, i) => (
                <div key={i} style={{ background: "white", border: "1px solid #E8E3DC", borderRadius: 8, padding: "8px 12px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div style={{ fontSize: 11, fontWeight: 600, color: "#333" }}>{item.area}</div>
                    <div style={{ fontSize: 10, color: "#aaa" }}>{item.course}</div>
                  </div>
                  <span style={{ fontSize: 13, color: "#27AE60" }}>✓</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Services */}
        <div>
          <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: "#aaa", fontFamily: "monospace", marginBottom: 8 }}>
            Programs & Services
          </div>
          {school.services.map((svc, i) => (
            <div key={i} style={{ background: "white", border: `1px solid #E8E3DC`, borderLeft: `3px solid ${svc.color}`, borderRadius: "0 10px 10px 0", padding: "14px 16px", marginBottom: 8 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                <span style={{ fontSize: 13, fontWeight: 700, color: svc.color }}>{svc.name}</span>
                <span style={{ fontSize: 10, fontWeight: 700, padding: "1px 8px", borderRadius: 20, background: svc.color, color: "white", letterSpacing: "0.04em" }}>{svc.type}</span>
              </div>
              <p style={{ fontSize: 12, color: "#555", lineHeight: 1.6, margin: "0 0 8px" }}>{svc.description}</p>
              <div style={{ fontSize: 11, fontWeight: 600, color: svc.color }}>→ {svc.action}</div>
            </div>
          ))}
        </div></>
      }
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(SchoolRequirements));

  </script>
</body>
</html>
